# TraceMind + demo stack. `cp .env.example .env` first.
# Remediation (Docker sandbox) needs the Docker socket: add  -f docker-compose.remediation.yml  (see README).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracemind}"]
      interval: 5s
      retries: 10
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      TRACEMIND_INGEST_TOKEN: ${TRACEMIND_INGEST_TOKEN:-}
    volumes: ["./infra/collector/config.yaml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4318:4318"]
    mem_limit: ${COLLECTOR_MEM_LIMIT:-512m}
    restart: unless-stopped
    depends_on: [tracemind-backend]

  # ---- TraceMind
  tracemind-backend:
    build: ./tracemind/backend
    environment:
      TRACEMIND_DATABASE_URL: ${TRACEMIND_DATABASE_URL}
      TRACEMIND_API_KEY: ${TRACEMIND_API_KEY:-}
      TRACEMIND_INGEST_TOKEN: ${TRACEMIND_INGEST_TOKEN:-}
      TRACEMIND_AUTH_REQUIRED: ${TRACEMIND_AUTH_REQUIRED:-false}
      TRACEMIND_CORS_ORIGINS: ${TRACEMIND_CORS_ORIGINS:-}
      TRACEMIND_TRUST_PROXY: ${TRACEMIND_TRUST_PROXY:-false}
      TRACEMIND_REDACTION: ${TRACEMIND_REDACTION:-on}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      TRACEMIND_REGRESSION_TEST: tests/test_sandbox_regression.py
      TRACEMIND_GRAPH_ROOT: /tmp/tracemind-graphs
      TRACEMIND_REPO_ROOTS: /workspace          # repositories may only be registered under these roots
      TRACEMIND_DB_POOL_MAX: ${TRACEMIND_DB_POOL_MAX:-8}
      TRACEMIND_MAX_CONCURRENT_JOBS: ${TRACEMIND_MAX_CONCURRENT_JOBS:-2}
      MODEL_TIMEOUT_S: ${MODEL_TIMEOUT_S:-300}
      MODEL_THINKING_LEVEL: ${MODEL_THINKING_LEVEL:-}
      GIT_CONFIG_COUNT: "1"            # read-only mount is owned by another uid
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - ./.tracemind/demo-repo:/workspace/demo-repo:ro
    ports: ["127.0.0.1:8100:8100"]
    mem_limit: ${BACKEND_MEM_LIMIT:-1g}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/healthz"]
      interval: 5s
      retries: 20
  tracemind-web:
    build: ./tracemind/web
    ports: ["127.0.0.1:5174:5174"]
    depends_on: [tracemind-backend]

  # ---- Demo application (the telemetry producer; TraceMind does not depend on it)
  demo-db-init:
    build: ./demo/db
    environment:
      APP_DATABASE_URL: ${APP_DATABASE_URL}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
  demo-api:
    build: ./demo/api
    environment: &demo-env
      APP_DATABASE_URL: ${APP_DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-demo}
      SERVICE_VERSION: ${SERVICE_VERSION:-1.0.0}
      FAULT_INJECTION_ENABLED: ${FAULT_INJECTION_ENABLED:-true}
      WORKER_PREFETCH: ${WORKER_PREFETCH:-1}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      rabbitmq: { condition: service_healthy }
      demo-db-init: { condition: service_completed_successfully }
  demo-worker:
    build: ./demo/worker
    environment: *demo-env
    restart: on-failure
    depends_on:
      rabbitmq: { condition: service_healthy }
      demo-db-init: { condition: service_completed_successfully }
  demo-web:
    build: ./demo/web
    ports: ["127.0.0.1:5173:80"]
    depends_on: [demo-api]
volumes:
  pgdata:
