receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  otlphttp/tracemind:
    endpoint: http://tracemind-backend:8100
    encoding: proto
    headers:
      Authorization: "Bearer ${env:TRACEMIND_INGEST_TOKEN}"   # empty token = backend ingest auth disabled
    retry_on_failure:
      enabled: true
      max_elapsed_time: 60s
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tracemind, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/tracemind, debug]
