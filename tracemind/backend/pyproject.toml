[project]
name = "tracemind"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "psycopg[binary,pool]>=3.2", "pydantic>=2.7",
  "pydantic-settings>=2.3", "httpx>=0.27", "opentelemetry-proto>=1.25", "protobuf>=4.25",
  "langgraph>=0.2", "python-multipart>=0.0.9",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["tracemind"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 140
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E702", "E741"]  # compact one-liners and short loop names are intentional in this codebase
